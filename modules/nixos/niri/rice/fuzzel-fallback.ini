# ~/.config/fuzzel/dank-rice.ini 의 초기값.
#
# 평소에는 apps/rice-fuzzel 이 DMS 팔레트에서 뽑아 이 파일을 통째로 덮어쓴다.
# 여기 있는 값이 실제로 쓰이는 건 그 전, 즉 팔레트가 아직 없을 때다 — 첫 로그인,
# 또는 DMS 가 안 뜬 상태. 셸이 죽었을 때 여는 런처라서 그 상황에서 읽히는 게
# 제일 중요하고, 그래서 무채색에 거의 불투명하다.
#
# 덮어써지는 파일이라 apps/rice-save 로 되받아 저장되지 않는다. 이 폴백을 고치려면
# 레포의 이 파일을 고쳐야 한다.

[main]
# 화면 높이의 80%를 채우는 줄 수. rice-fuzzel 이 실제 해상도로 다시 계산한다.
lines=15

[border]
radius=12

[colors]
background=161616f5
text=d8d8d8ff
message=b0b0b0ff
prompt=8a8a8aff
placeholder=6a6a6aff
input=eaeaeaff
match=ffffffff
selection=2f2f2fff
selection-text=ffffffff
selection-match=ffffffff
counter=6a6a6aff
border=4a4a4aff
