# AeroSpace tiling window manager config.
# Managed by Nix — symlinked read-only from the store via modules/darwin/files.nix.
# To change: edit this file and `darwin-rebuild switch`, then `alt-shift-;` -> `esc`
# (service mode reload) or it auto-reloads on the next launch.
# Reference: https://nikitabobko.github.io/AeroSpace/guide

# Commands to run after AeroSpace startup / login. Left empty.
after-login-command = []
after-startup-command = []

# We start AeroSpace via a Nix-managed LaunchAgent (hosts/darwin/default.nix),
# so don't also register AeroSpace's own login item.
start-at-login = false

# Normalizations — keep the tree tidy. Defaults, kept explicit.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Padding inside the accordion layout.
accordion-padding = 30

# New windows tile by default; orientation follows the focused container's shape.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Follow focus with the mouse when switching monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Don't fight with macOS-hidden apps (Cmd-H).
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Gaps between windows and screen edges (points).
[gaps]
inner.horizontal = 4
inner.vertical =   4
outer.left =       2
outer.bottom =     2
outer.top =        2
outer.right =      2

# ----------------------------------------------------------------------------
# Main mode — active by default. Modifier is alt (⌥).
# ----------------------------------------------------------------------------
[mode.main.binding]

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'      # toggle horizontal/vertical tiles
alt-comma = 'layout accordion horizontal vertical'  # toggle accordion

# Focus (vim hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Fullscreen (within the AeroSpace layout, not native macOS fullscreen)
alt-f = 'fullscreen'

# Floating <-> tiling toggle for the focused window
alt-shift-space = 'layout floating tiling'

# Switch to workspace 1..9
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move focused window to workspace 1..9
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Jump back to the previous workspace
alt-tab = 'workspace-back-and-forth'
# Send the current workspace to the next monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode (for reload / tree surgery)
alt-shift-semicolon = 'mode service'

# ----------------------------------------------------------------------------
# Service mode — one-shot helpers, returns to main mode after each.
# Enter with alt-shift-; ; press esc to leave.
# ----------------------------------------------------------------------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']            # reset the layout tree
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join the focused window with a neighbor (build splits)
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
