# `typos` 설정. 여기 적힌 것은 전부 오탐이다 — 도구 이름, 커널/하드웨어 용어,
# 셰이더 변수처럼 영어 단어가 아닌 것들.
#
# typos 는 인라인 무시 주석(`typos:ignore` 같은 것)을 지원하지 않는다. 예외는
# 오직 이 파일로만 만든다.

[default.extend-words]
# 도구 이름
wrk = "wrk"          # HTTP 부하 측정기
# 하드웨어 / 커널 용어
BARs = "BARs"        # PCI Base Address Registers
cros = "cros"        # ChromeOS 커널 모듈 접두어 (cros_ec_sensorhub)
Lod = "Lod"          # GLSL textureLod
# GLSL 벡터 변수 (b - a)
ba = "ba"

[default.extend-identifiers]
# 정규식 조각이라 단어로 안 끝난다 (postmortem 문서의 grep 패턴)
composit = "composit"
Composit = "Composit"

[files]
extend-exclude = [
  "flake.lock",
]
