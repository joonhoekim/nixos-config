# rift-grid config.
#
# This copy is a *seed*. modules/darwin/rice plants it at
# ~/.config/rift-grid/config.toml on a machine that has none, and after that the
# live file is the original — edit that one, watch rift hot-reload it, and run
# `apps/rice/save rift` to bring the result back here. `apps/rice/restore rift`
# pushes the other way. If a change does not seem to take, press Alt+Ctrl+R
# (reload_config, bound below); it also prints the reason when the file is bad.
#
# Reference: https://github.com/acsandmann/rift/wiki
# Why the keymap looks the way it does: docs/macos-rice.md, docs/keymap.md.

[settings]
# Upstream starts with this true: rift manages nothing until the toggle is
# pressed, so a rebuild looks like "nothing tiles". Alt+Z is the per-space
# off switch.
default_disable = false

animate = true
animation_duration = 0.2
animation_fps = 120.0

# Focus on click, not on hover — same on hyprland (`follow_mouse = 0`) and
# niri. With hover focus the first keystroke after a keyboard switch can land
# in whatever window the pointer was left over.
focus_follows_mouse = false

# Set to true to warp the pointer to a window focused from the keyboard.
mouse_follows_focus = false
mouse_hides_on_focus = false

# Windows that must never steal focus or drag a workspace switch with them.
auto_focus_blacklist = [
  "com.apple.Spotlight",
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
]

hot_reload = true

run_on_start = []

[settings.layout]
# Every workspace's mode. Alt+Ctrl+Shift+1..4 switches the active workspace
# live, but reload_config (Alt+Ctrl+R) puts all of them back on this value.
#   traditional   i3/sway containers — nested splits resized as a tree
#   bsp           binary space partitioning
#   master_stack  one master pane + a stack
#   scrolling     niri's infinite horizontal strip of columns; the shape
#                 modules/nixos/niri runs on the NixOS side
#
# The [settings.layout.scrolling] block below is still read — it governs any
# workspace put on that mode with Alt+Ctrl+Shift+4, and $HOME/.config/rice/bin/
# monocle.sh (Alt+R) reads its width bounds whatever the mode is.
#
# bsp because each workspace is a cell of the grid below, and subline splits a
# cell the same way: a new window halves the focused tile along its longer side.
mode = "bsp"

# A new window opens next to the focused one, not at the far end of the
# workspace. Applies to traditional too, not only scrolling (measured).
window_insertion_point = "next_to_selection"

[settings.layout.traditional]
# Siblings in a split share the space evenly when one is added or removed,
# rather than the new window taking half of the focused one and leaving the
# rest untouched.
equalize_nodes = true

[settings.layout.scrolling]
# Width of a new column, as a fraction of the display. rift has no preset
# cycle like niri's 33/50/66; Alt+Minus / Alt+Equal walk it between the bounds.
column_width_ratio = 0.5
min_column_width_ratio = 0.33
# 1.0, not 0.9, so the Alt+R monocle toggle can actually fill the display —
# the toggle walks the width between column_width_ratio and this bound.
max_column_width_ratio = 1.0

# "niri": reveal a column only when navigation needs it, i.e. the strip moves
# as little as possible and the focused column does not jump to a fixed spot.
# This overrides `alignment` by design — set focus_navigation_style to
# "anchored" if you want the focused column pinned to `alignment` instead.
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
# Three-finger horizontal scroll walks the columns. It shares the gesture with
# [settings.gestures]; `propagate_to_workspace_swipe` hands the swipe on to
# workspace switching when the strip runs out. If swipes feel double-fired,
# turn this off first.
enabled = false
fingers = 3
invert_horizontal = false
propagate_to_workspace_swipe = true

[settings.layout.gaps.outer]
top = 6
left = 6
bottom = 6
right = 6

[settings.layout.gaps.inner]
# rift 0.5.8 미만에서는 이게 0 이 아니면 스크롤링 레이아웃의 스트립이 포커스가
# 바뀔 때마다 이 폭만큼 좌우로 밀린다(acsandmann/rift#449).
horizontal = 6
vertical = 6

[settings.ui.menu_bar]
# The workspace indicator in the macOS menu bar — the reason there is no
# status bar (docs/macos-rice.md).
enabled = true
# macOS truncates the whole indicator when the menu bar runs out of room.
show_empty = false
# Draw every workspace, not just the active one, so the indicator answers
# "where else is there something" and not only "where am I".
mode = "all"
# Labels rather than layout previews: the label is what the keybinding says.
# workspace_names is "1".."9", so `name` is the digit you press — `index`
# would render 0..8 and be off by one from the keymap.
active_label = "name"
display_style = "label"

[settings.ui.stack_line]
enabled = true

[settings.ui.mission_control]
# On because Alt+O drives it (`show_mission_control_all`), the overview key of
# subline's ijkl preset. rift can only reach the overview with this enabled.
enabled = true
# Recapture the visible previews twice a second while the overview is open, so
# the cells show what the windows are doing now (rift-grid only).
live_preview_interval_ms = 500
fade_enabled = true
grid_style = "zoom"
grid_fit = false
grid_follow = "center"
grid_gap = 0.01
grid_zoom = 0.75


[settings.ui.borders]
# A ring just outside every visible window (rift-grid only). The focused one
# is in active_color with a glow, and slides to the next focused window over
# animation_ms. Colours are 0xAARRGGBB or #RRGGBB[AA]; apps/rice/colors
# rewrites the two colour lines when the palette changes, unless they were
# picked by hand. An empty inactive_color leaves the other windows bare.
enabled = true
width = 2.0
radius = 16.0
active_color = "0xff990006"
inactive_color = ""
glow = true
glow_radius = 12.0
animation_ms = 180.0

[settings.ui.grid_motion]
zoom = 0.15
easing = "snappy"
duration_ms = 250.0
zoom_out_time = 0.3
zoom_in_time = 0.3

[settings.gestures]
# Upstream's three-finger horizontal swipe between workspaces. With the grid on
# (grid_columns below), [settings.grid_gestures] takes three and four fingers
# first, so these settings only lend the grid's swipes their distance,
# tolerance and haptics. `consume_dock_swipe` stops macOS from *also*
# switching its own Spaces on the same gesture.
enabled = true
consume_dock_swipe = true
skip_empty = true
fingers = 3
haptics_enabled = true
haptic_pattern = "level_change"

[settings.grid_gestures]
# rift-grid only, and the defaults. The content follows the fingers, as in
# macOS: three fingers any way go to the neighboring cell (left shows the cell
# to the right); four fingers left/right go through the grids on the focused
# display; four fingers up open the Overview (Alt+O) and step out to the whole
# grid, and down steps back in (Esc). macOS keeps four fingers down while the
# Overview is closed (App Exposé). `enabled = false` gives all of them back.
enabled = true
cell_fingers = 3
grid_fingers = 4
overview = true

[virtual_workspaces]
enabled = true
# rift-grid only: workspaces come in grids, as in subline. A grid is a context
# (a project, a kind of work) and its 3x3 cells are what the display shows, read
# row by row from the top left (1 2 3 / 4 5 6 / 7 8 9). There are nine grids,
# Alt+1..9, and each is on one display at a time: Alt+N goes to the display
# grid N is on, and is how the focus crosses displays; a grid on no display yet
# comes up on the focused one. Within a grid, grid_focus and grid_move below
# cross into the next cell at a cell's edge, and never into another grid. With
# grid_columns set, each display gets 9 x 9 = 81 workspaces and
# default_workspace_count is unused. The menu bar draws a map per grid in use,
# and the overview shows the grid on screen. Login starts on grid 1's center
# cell (index 4), and each further display on the next free grid.
# docs/grids.md in the rift-grid repo has the model.
default_workspace_count = 9
grid_columns = 3
default_workspace = 4
# Cell names, repeated in every grid after its number ("2·5").
workspace_names = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
workspace_rules = []

# Windows that should never be tiled. macOS scatters small utility panels that
# a tiling WM will happily stretch to half the screen.
app_rules = [
  { app_id = "com.apple.systempreferences", floating = true },
  { app_id = "com.apple.ActivityMonitor", floating = true },
  { app_id = "com.apple.finder", ax_subrole = "AXDialog", floating = true },
  { title_substring = "Preferences", floating = true },
  { title_substring = "Settings", floating = true },
]
[modifier_combinations]
# Three tiers, the same as hyprland and niri with Super where this says Alt
# (macOS keeps Cmd for itself). The full table is docs/keymap.md.
#
#   Alt          go there, open it
#   Alt + Shift  take the window with you                   (= move)
#   Alt + Ctrl   cross a monitor or a grid, or reach the WM (= move2)
move = "Alt + Shift"
move2 = "Alt + Ctrl"

[keys]
# The reference is subline's "ijkl" preset, with Alt as subline's Mod. Where
# this file and the hyprland/niri columns of docs/keymap.md disagree, the
# preset wins here: the workspaces are subline's grid, and the keys that walk
# it should be the ones subline uses.
#
# ── Tier 1 — Alt: go there, open it ──────────────────────────────────────
#
# Directions are IJKL, the inverted-T that matches the arrow keys:
#
#         I                 ↑
#    J    K    L        ←   ↓   →
#
# The arrows are bound to the same actions throughout.
#
# grid_focus moves between tiles inside the cell and, at the cell's edge, into
# the neighbouring cell of the workspace grid — subline's Mod+direction. This
# is also how workspaces are walked: there is no back/forward pair, and Alt+U
# is left empty, as in the preset.
"Alt + I" = { grid_focus = "up" }
"Alt + K" = { grid_focus = "down" }
"Alt + J" = { grid_focus = "left" }
"Alt + L" = { grid_focus = "right" }
"Alt + Up" = { grid_focus = "up" }
"Alt + Down" = { grid_focus = "down" }
"Alt + Left" = { grid_focus = "left" }
"Alt + Right" = { grid_focus = "right" }

# Whole cells at a time, whatever the tiles inside — subline's three-finger
# swipe.
"Alt + Cmd + I" = { grid_cell = "up" }
"Alt + Cmd + K" = { grid_cell = "down" }
"Alt + Cmd + J" = { grid_cell = "left" }
"Alt + Cmd + L" = { grid_cell = "right" }

# The grid's center cell, where login starts — subline's Mod+H
# (focus-default-workspace).
"Alt + H" = "grid_center"

# The window focused before this one, in whatever cell or grid it is; again
# goes back — subline's Alt+Tab (cycle-windows), without its switcher row.
"Alt + Tab" = "focus_recent_window"

# Grids 1..9 (rift-grid). A grid is a context, 3x3 cells of it, and the digit
# brings it back at the cell it was left on; within a grid, cells are reached
# with the directions above. Alt+Ctrl+digit, below, sends a window to a grid.
"Alt + 1" = { switch_to_grid = 1 }
"Alt + 2" = { switch_to_grid = 2 }
"Alt + 3" = { switch_to_grid = 3 }
"Alt + 4" = { switch_to_grid = 4 }
"Alt + 5" = { switch_to_grid = 5 }
"Alt + 6" = { switch_to_grid = 6 }
"Alt + 7" = { switch_to_grid = 7 }
"Alt + 8" = { switch_to_grid = 8 }
"Alt + 9" = { switch_to_grid = 9 }

# subline-terminal (docs/subline-terminal.md). Through `open -n` so
# LaunchServices starts it: it is Regular from the start (rift admits it at
# once) and not rift's child, so restarting rift does not end the terminals.
# `-n` starts a new process each time, which hands its window to the app
# already up.
"Alt + Enter" = { exec = ["/bin/sh", "-c", "exec /usr/bin/open -n -a \"$HOME/Applications/subline-terminal.app\""] }

# Overview — subline's Mod+O. hyprland has the DMS overview and niri its own;
# here it is rift-grid's grid overview, which rift drives as Mission Control.
# Requires [settings.ui.mission_control] enabled = true, above.
"Alt + O" = "show_mission_control_all"

# File manager — subline's Mod+E, which runs `xdg-open ~`. `open ~` is the
# same thing on macOS: a Finder window on the home folder.
"Alt + E" = { exec = ["/bin/sh", "-c", "open ~"] }

# rift's settings window — subline's Mod+Comma opens its own settings.
"Alt + Comma" = { exec = ["/bin/sh", "-c", "rift-grid-cli settings"] }

# Close the focused window (hyprland/niri Mod+Q). Distinct from Cmd-Q, which
# quits the whole application.
"Alt + Q" = "close_window"

# Cheatsheet on Mod+? (Alt+Shift+Slash), as in subline: opens docs/keymap.md
# rather than drawing an overlay (docs/macos-rice.md has why). `open`, not
# `open -a`, so it follows the markdown handler in
# modules/darwin/default-apps.nix.
#
# This points at the checkout — if the repo moves, the key quietly stops
# working.
"Alt + Shift + Slash" = { exec = ["/bin/sh", "-c", "open ${RICE_REPO:-$HOME/nixos-config}/docs/keymap.md"] }

# Fullscreen, gentle version: fills the tiling area and leaves the outer gaps,
# so the menu bar stays reachable. Shift is the drastic one, as on hyprland
# and niri.
"Alt + F" = "toggle_fullscreen_within_gaps"

"Alt + C" = "center_selection"
"Alt + Minus" = { resize_window_shrink = "smart" }
"Alt + Equal" = { resize_window_grow = "smart" }

# Width preset cycle on hyprland and niri. rift has no maximise command, so
# monocle.sh toggles the focused column wide and back (its header has how).
# Seeded to $HOME by modules/darwin/rice — a store path cannot be
# interpolated into plain TOML.
"Alt + R" = { exec = ["/bin/sh", "-c", "$HOME/.config/rice/bin/monocle.sh"] }

# ── Tier 2 — Alt+Shift: take the window with you ─────────────────────────
# Directions, and the two window-state keys that have a bigger sibling. The
# window crosses into the next cell at the cell's edge, so this is also how a
# window moves between workspaces.
"move + I" = { grid_move = "up" }
"move + K" = { grid_move = "down" }
"move + J" = { grid_move = "left" }
"move + L" = { grid_move = "right" }
"move + Up" = { grid_move = "up" }
"move + Down" = { grid_move = "down" }
"move + Left" = { grid_move = "left" }
"move + Right" = { grid_move = "right" }

# Fullscreen, drastic version: covers the whole display, gaps and menu bar
# included.
"move + F" = "toggle_fullscreen"
"move + Space" = "toggle_window_floating"

# Screenshot of a selected area to the clipboard — subline's Mod+Shift+S.
# Space during the selection switches to picking a window.
"move + S" = { exec = ["/bin/sh", "-c", "screencapture -i -c"] }

"Alt + Shift + Comma" = "toggle_stack"

# ── Tier 3 — Alt+Ctrl: cross a monitor or a grid, or reach the WM ────────
"move2 + I" = { move_window_to_display = { selector = "up" } }
"move2 + K" = { move_window_to_display = { selector = "down" } }
"move2 + J" = { move_window_to_display = { selector = "left" } }
"move2 + L" = { move_window_to_display = { selector = "right" } }
"move2 + Up" = { move_window_to_display = { selector = "up" } }
"move2 + Down" = { move_window_to_display = { selector = "down" } }
"move2 + Left" = { move_window_to_display = { selector = "left" } }
"move2 + Right" = { move_window_to_display = { selector = "right" } }

# Send the focused window to grid N's current cell — subline's Mod+Ctrl+digit
# (send-to-grid). The focus stays, unless grid N is on screen on another
# display: then it goes along with the window.
"move2 + 1" = { move_window_to_grid = 1 }
"move2 + 2" = { move_window_to_grid = 2 }
"move2 + 3" = { move_window_to_grid = 3 }
"move2 + 4" = { move_window_to_grid = 4 }
"move2 + 5" = { move_window_to_grid = 5 }
"move2 + 6" = { move_window_to_grid = 6 }
"move2 + 7" = { move_window_to_grid = 7 }
"move2 + 8" = { move_window_to_grid = 8 }
"move2 + 9" = { move_window_to_grid = 9 }

"move2 + R" = "reload_config"

# Layout modes. No counterpart on the other two — hyprland and niri each have
# one layout and that is the whole point of them. Shift on top of Ctrl, since
# Alt+Ctrl+digit is send-to-grid.
"Alt + Ctrl + Shift + 1" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Ctrl + Shift + 2" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Ctrl + Shift + 3" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Ctrl + Shift + 4" = { set_workspace_layout = { mode = "scrolling" } }

# ── Tier 4 — rift only ───────────────────────────────────────────────────
# Deliberately not mirrored anywhere. These are tree operations that the
# scrolling layouts on Linux do not have a concept of, so giving them keys
# that mean something else over there would cost more than it buys. They sit
# on keys that are unbound on hyprland and niri, so nothing contradicts.

# Per-space master switch. Handy when an app needs to be left alone for a
# minute (screen sharing, a video call's floating tile).
"Alt + Z" = "toggle_space_activated"
"Alt + Slash" = "toggle_orientation"

# Join with a neighbour, or unjoin if already joined. "right" because the
# scrolling strip grows rightwards; expelling ignores the argument.
#
# It must have one: a bare `"consume_or_expel_window"` is a parse error, and
# rift rejects the *whole file* on one bad line and silently keeps running the
# previous config. `rift-grid-cli execute config reload` prints the reason.
"Alt + Ctrl + E" = { consume_or_expel_window = "right" }

"Alt + Ctrl + Space" = "toggle_focus_floating"

# ── Deliberately unbound ─────────────────────────────────────────────────
#
#   Alt + D        launcher. macOS has Spotlight on Cmd-Space; hyprland and
#                  niri need the key because fuzzel is the fallback when the
#                  shell is not up.
#   Alt + U        empty in subline's ijkl preset too.
