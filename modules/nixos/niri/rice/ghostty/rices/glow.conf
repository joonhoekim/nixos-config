# glow — 인광체 잔광만. crt 에서 가독성을 해치는 부분(곡률·색수차·그릴)을 빼고
# 글자 번짐과 아주 얕은 스캔라인만 남겼다. 하루 종일 켜 둘 만한 쪽이다.
custom-shader = shaders/glow.glsl

# 셰이더가 iTime 을 안 쓰므로 애니메이션 루프가 필요 없다. 끄면 화면이 바뀔
# 때만 그린다 — 가만히 있는 터미널은 GPU 를 안 먹는다.
custom-shader-animation = false

# 창을 도려내지 않으니 기본 투명도와 여백 그대로 간다.
background-opacity = 0.94
window-padding-x = 20
window-padding-y = 20
