# Seed only: once planted, ~/.config/rift-grid/config.toml is the original (apps/rice/save · restore). 전체 그림: docs/macos-rice.md
# If a change does not take, Alt+Ctrl+R (reload_config) also prints why the file is bad. Keymap: docs/keymap.md

[settings]
# Upstream defaults to true: rift manages nothing until toggled, so a rebuild looks like "nothing tiles".
default_disable = false

animate = true
animation_duration = 0.2
animation_fps = 120.0

# With hover focus the first keystroke after a keyboard switch can land in the window under the pointer.
focus_follows_mouse = false

mouse_follows_focus = false
mouse_hides_on_focus = false

auto_focus_blacklist = [
  "com.apple.Spotlight",
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
]

hot_reload = true

run_on_start = []

[settings.layout]
# bsp: each workspace is a grid cell, split the way subline does (halve the focused tile along its longer side).
# reload_config resets every workspace to this. [settings.layout.scrolling] is still read: monocle.sh (Alt+R) uses its bounds.
mode = "bsp"

# Applies to traditional too, not only scrolling (measured).
window_insertion_point = "next_to_selection"

[settings.layout.traditional]
equalize_nodes = true

[settings.layout.scrolling]
# rift-grid has no preset cycle like niri's 33/50/66; Alt+Minus / Alt+Equal walk between the bounds.
column_width_ratio = 0.5
min_column_width_ratio = 0.33
# 1.0, not 0.9, so the Alt+R monocle toggle can actually fill the display.
max_column_width_ratio = 1.0

# "niri" overrides `alignment` by design; "anchored" would pin the focused column to `alignment` instead.
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
# Shares the gesture with [settings.gestures]; if swipes feel double-fired, turn this off first.
enabled = false
fingers = 3
invert_horizontal = false
propagate_to_workspace_swipe = true

[settings.layout.gaps.outer]
top = 6
left = 6
bottom = 6
right = 6

[settings.layout.gaps.inner]
# rift 0.5.8 미만에서는 이게 0 이 아니면 스크롤링 레이아웃의 스트립이 포커스가
# 바뀔 때마다 이 폭만큼 좌우로 밀린다(acsandmann/rift#449).
horizontal = 6
vertical = 6

[settings.ui.menu_bar]
enabled = true
# macOS truncates the whole indicator when the menu bar runs out of room.
show_empty = false
# All workspaces, so it answers "where else is there something", not only "where am I".
mode = "all"
# workspace_names is "1".."9", so `name` is the digit you press — `index` would be off by one (0..8).
active_label = "name"
display_style = "label"

[settings.ui.stack_line]
enabled = true

[settings.ui.mission_control]
# rift-grid can only reach the overview (Alt+O) with this enabled.
enabled = true
fade_enabled = true
# Sharp previews, for more memory while the overview is open.
full_resolution = true
grid_fit = false
grid_follow = "center"
grid_gap = 0.01
grid_zoom = 0.75


[settings.ui.borders]
# apps/rice/colors rewrites the two colour lines on a palette change, unless they were picked by hand.
# Colours are 0xAARRGGBB or #RRGGBB[AA]; an empty inactive_color leaves the other windows bare.
enabled = true
width = 2.0
radius = 16.0
active_color = "0xff990006"
inactive_color = ""
glow = true
glow_radius = 12.0
animation_ms = 180.0

[settings.ui.grid_motion]
zoom = 0.15
easing = "snappy"
duration_ms = 250.0
zoom_out_time = 0.3
zoom_in_time = 0.3
# Sharper slides between cells on Retina, for four times the pixels.
full_resolution = true

[settings.gestures]
# With grid_columns set, [settings.grid_gestures] takes three and four fingers first, so these only lend its swipes
# distance, tolerance and haptics. `consume_dock_swipe` stops macOS from *also* switching its own Spaces.
enabled = true
consume_dock_swipe = true
skip_empty = true
fingers = 3
haptics_enabled = true
haptic_pattern = "level_change"

[settings.grid_gestures]
# rift-grid defaults: 3 fingers → neighbouring cell, 4 left/right → grids, 4 up/down → into/out of the Overview
# (macOS keeps 4 down while it is closed, for App Exposé). `enabled = false` gives them all back.
enabled = true
cell_fingers = 3
grid_fingers = 4
overview = true

[virtual_workspaces]
enabled = true
# Nine 3x3 grids (Alt+1..9), each on one display at a time: 81 workspaces per display, so default_workspace_count is unused.
# Login starts on grid 1's center cell (index 4). Model: docs/grids.md in the rift-grid repo.
default_workspace_count = 9
grid_columns = 3
default_workspace = 4
# Cell names, repeated in every grid after its number ("2·5").
workspace_names = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
workspace_rules = []

# macOS utility panels that a tiling WM would happily stretch to half the screen.
app_rules = [
  { app_id = "com.apple.systempreferences", floating = true },
  { app_id = "com.apple.ActivityMonitor", floating = true },
  { app_id = "com.apple.finder", ax_subrole = "AXDialog", floating = true },
  { title_substring = "Preferences", floating = true },
  { title_substring = "Settings", floating = true },
]
[modifier_combinations]
# Three tiers as on hyprland/niri, with Alt for Super (macOS keeps Cmd). Full table: docs/keymap.md
move = "Alt + Shift"
move2 = "Alt + Ctrl"

[keys]
# Follows subline's "ijkl" preset (Alt = Mod); where it disagrees with docs/keymap.md's hyprland/niri columns, the preset wins.
# ── Tier 1 — Alt: go there, open it ──────────────────────────────────────
# grid_focus crosses into the neighbouring cell at a cell's edge, so it also walks workspaces (no back/forward pair).
"Alt + I" = { grid_focus = "up" }
"Alt + K" = { grid_focus = "down" }
"Alt + J" = { grid_focus = "left" }
"Alt + L" = { grid_focus = "right" }
"Alt + Up" = { grid_focus = "up" }
"Alt + Down" = { grid_focus = "down" }
"Alt + Left" = { grid_focus = "left" }
"Alt + Right" = { grid_focus = "right" }

# Whole cells at a time — subline's three-finger swipe.
"Alt + Cmd + I" = { grid_cell = "up" }
"Alt + Cmd + K" = { grid_cell = "down" }
"Alt + Cmd + J" = { grid_cell = "left" }
"Alt + Cmd + L" = { grid_cell = "right" }

# Center cell, where login starts — subline's Mod+H.
"Alt + H" = "grid_center"

# Previous window wherever it is; again goes back — subline's Alt+Tab without its switcher row.
"Alt + Tab" = "focus_recent_window"

# A grid comes back at the cell it was left on.
"Alt + 1" = { switch_to_grid = 1 }
"Alt + 2" = { switch_to_grid = 2 }
"Alt + 3" = { switch_to_grid = 3 }
"Alt + 4" = { switch_to_grid = 4 }
"Alt + 5" = { switch_to_grid = 5 }
"Alt + 6" = { switch_to_grid = 6 }
"Alt + 7" = { switch_to_grid = 7 }
"Alt + 8" = { switch_to_grid = 8 }
"Alt + 9" = { switch_to_grid = 9 }

# `open -n` so LaunchServices starts it: Regular at once (rift-grid admits it) and not rift-grid's child, so
# restarting rift-grid keeps the terminals. Each new process hands its window to the app already up.
"Alt + Enter" = { exec = ["/bin/sh", "-c", "exec /usr/bin/open -n -a \"$HOME/Applications/subline-terminal.app\""] }

# rift-grid's grid overview, driven as Mission Control — needs [settings.ui.mission_control] enabled.
"Alt + O" = "show_mission_control_all"

"Alt + E" = { exec = ["/bin/sh", "-c", "open ~"] }

"Alt + Comma" = { exec = ["/bin/sh", "-c", "rift-grid-cli settings"] }

# Closes the window only; Cmd-Q quits the whole application.
"Alt + Q" = "close_window"

# Cheatsheet (subline's Mod+?): `open`, not `open -a`, so it follows the markdown handler in default-apps.nix.
# Points at the checkout — if the repo moves, the key quietly stops working.
"Alt + Shift + Slash" = { exec = ["/bin/sh", "-c", "open ${RICE_REPO:-$HOME/nixos-config}/docs/keymap.md"] }

# Gentle fullscreen keeps the outer gaps so the menu bar stays reachable; Shift is the drastic one.
"Alt + F" = "toggle_fullscreen_within_gaps"

"Alt + C" = "center_selection"
"Alt + Minus" = { resize_window_shrink = "smart" }
"Alt + Equal" = { resize_window_grow = "smart" }

# rift-grid has no maximise, so monocle.sh toggles the column wide and back.
# Seeded to $HOME by modules/darwin/rice — a store path cannot go into plain TOML.
"Alt + R" = { exec = ["/bin/sh", "-c", "$HOME/.config/rice/bin/monocle.sh"] }

# ── Tier 2 — Alt+Shift: take the window with you ─────────────────────────
# The window crosses into the next cell at the edge, so this also moves it between workspaces.
"move + I" = { grid_move = "up" }
"move + K" = { grid_move = "down" }
"move + J" = { grid_move = "left" }
"move + L" = { grid_move = "right" }
"move + Up" = { grid_move = "up" }
"move + Down" = { grid_move = "down" }
"move + Left" = { grid_move = "left" }
"move + Right" = { grid_move = "right" }

"move + F" = "toggle_fullscreen"
"move + Space" = "toggle_window_floating"

# Space during the selection switches to picking a window.
"move + S" = { exec = ["/bin/sh", "-c", "screencapture -i -c"] }

"Alt + Shift + Comma" = "toggle_stack"

# ── Tier 3 — Alt+Ctrl: cross a monitor or a grid, or reach the WM ────────
"move2 + I" = { move_window_to_display = { selector = "up" } }
"move2 + K" = { move_window_to_display = { selector = "down" } }
"move2 + J" = { move_window_to_display = { selector = "left" } }
"move2 + L" = { move_window_to_display = { selector = "right" } }
"move2 + Up" = { move_window_to_display = { selector = "up" } }
"move2 + Down" = { move_window_to_display = { selector = "down" } }
"move2 + Left" = { move_window_to_display = { selector = "left" } }
"move2 + Right" = { move_window_to_display = { selector = "right" } }

# Focus stays, unless grid N is on screen on another display — then it follows the window.
"move2 + 1" = { move_window_to_grid = 1 }
"move2 + 2" = { move_window_to_grid = 2 }
"move2 + 3" = { move_window_to_grid = 3 }
"move2 + 4" = { move_window_to_grid = 4 }
"move2 + 5" = { move_window_to_grid = 5 }
"move2 + 6" = { move_window_to_grid = 6 }
"move2 + 7" = { move_window_to_grid = 7 }
"move2 + 8" = { move_window_to_grid = 8 }
"move2 + 9" = { move_window_to_grid = 9 }

"move2 + R" = "reload_config"

# No counterpart on hyprland/niri (one layout each). Shift on top, since Alt+Ctrl+digit is send-to-grid.
"Alt + Ctrl + Shift + 1" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Ctrl + Shift + 2" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Ctrl + Shift + 3" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Ctrl + Shift + 4" = { set_workspace_layout = { mode = "scrolling" } }

# ── Tier 4 — rift-grid only ───────────────────────────────────────────────────
# Tree operations the Linux scrolling layouts lack, on keys unbound on hyprland and niri.

"Alt + Z" = "toggle_space_activated"
"Alt + Slash" = "toggle_orientation"

# The argument is required: a bare `"consume_or_expel_window"` is a parse error, and rift-grid then silently keeps
# the previous config. "right" because the strip grows rightwards; expelling ignores it.
"Alt + Ctrl + E" = { consume_or_expel_window = "right" }

"Alt + Ctrl + Space" = "toggle_focus_floating"

# ── Deliberately unbound: Alt+D (Spotlight is on Cmd-Space), Alt+U (empty in subline's ijkl preset too).
