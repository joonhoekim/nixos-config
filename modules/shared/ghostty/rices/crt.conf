# crt — 브라운관. space_dots(Golden Era) 라이스의 화면 셰이더를 터미널 하나에만
# 건 것이다. 무엇이 왜 바뀌었는지는 ../shaders/crt.glsl 머리말에 있다.
#
# 경로는 이 파일 기준 상대다. ghostty 가 config-file 로 읽어 들인 조각 안에서도
# 같은 규칙이 적용된다(실측 확인).
custom-shader = shaders/crt.glsl

# 그레인과 험 바가 시간에 걸려 있으므로 애니메이션 루프가 필요하다. 포커스된
# 창에서만 도는 루프라 CPU 는 한 자릿수 %% 다. 배터리가 아깝다면 glow 로.
custom-shader-animation = true

# 다른 룩(0.94)보다 더 비친다. 곡률·스캔라인·그릴이 이미 화면을 어둡게 깎아
# 놓기 때문에, 같은 값을 주면 crt 만 유독 탁해 보인다.
#
# 셰이더가 알파를 그대로 흘려보내야 이 값이 산다. crt.glsl 은 곡률 안쪽에서만
# 그렇게 하고, 검정으로 잘라낸 바깥은 불투명하게 남긴다 — 거기까지 비치면 유리
# 안쪽이 아니라 창에 뚫린 구멍이 된다. 자세한 건 shaders/crt.glsl 끝부분.
background-opacity = 0.9

# 배럴 왜곡이 가장자리를 안쪽으로 밀기 때문에 여백을 늘려야 첫 글자와 마지막
# 줄이 휘는 데 걸리지 않는다.
window-padding-x = 34
window-padding-y = 28
