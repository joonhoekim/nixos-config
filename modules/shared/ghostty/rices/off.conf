# off — 셰이더 없음. 기본 상태이자, 다른 룩이 창을 새까맣게 만들었을 때
# 돌아올 자리다 (`apps/rice-term off`).
#
# custom-shader 는 반복 지정이 가능한 키라, 빈 값이 "목록을 비워라"는 뜻이다.
# 위 config 에서 켜 둔 게 없더라도 명시적으로 비워야 한다 — 조각끼리 전환할 때
# 앞 조각이 켜 둔 셰이더가 남지 않으려면 이 줄이 있어야 한다.
custom-shader =

# 아래 셋은 이 룩에서 바꿀 게 없지만 그래도 적는다. 조각은 이전 조각을 지우지
# 않고 덮어쓰기만 하므로, 어느 조각에만 있는 키가 생기면 A→B→A 로 돌아왔을 때
# 원래 값으로 안 돌아온다. rice/profiles/README.md 의 규칙과 같다.
custom-shader-animation = true
background-opacity = 0.94
window-padding-x = 20
window-padding-y = 20
