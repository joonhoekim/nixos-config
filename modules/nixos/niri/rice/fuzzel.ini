# fuzzel — 폴백 런처(Mod+D)이자 apps/rice-wall --pick 의 dmenu 백엔드.
#
# 다른 리싱 파일과 같은 규칙: 이건 시드일 뿐이고 ~/.config/fuzzel/fuzzel.ini 는
# 평범한 쓰기 가능한 파일이다. 고치면 다음 실행부터 반영된다.
#
# 이 파일은 "형태"만 정한다. 색은 전부 dank-colors.ini 에 있고, apps/rice-fuzzel
# 이 파일 맨 위에 include 줄을 붙여 준다(fuzzel 의 include 는 기본 섹션 전용이라
# 첫 [main] 앞에 와야 하고, 절대 경로만 받는다 — 그래서 레포 시드에는 없다).
#
# 색을 여기에 하나도 남기지 않은 것은 의도적이다. include 가 먼저 읽히므로
# 여기에 [colors] 를 두면 그게 생성된 색을 덮어써 버린다.

[main]
font=Inter:size=11
dpi-aware=no

prompt="❯ "
icon-theme=Adwaita
icons-enabled=yes

# 12줄 / 화면 폭의 45자. 월페이퍼 고를 때 경로가 길어서 좁으면 잘린다.
lines=12
width=45

horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=24

# overlay 레이어라 DMS 의 바보다 위에 뜬다. 포커스를 잃으면 닫히는 편이
# 런처답다 — 특히 실수로 열었을 때.
layer=overlay
exit-on-keyboard-focus-loss=yes

[border]
width=2
# radius 는 dank-colors.ini 가 프로필의 cornerRadius 로 덮어쓴다.
radius=12
