# crt — 브라운관. 경로는 이 조각 기준 상대다(config-file 로 읽힌 조각 안에서도, 실측).
custom-shader = shaders/crt.glsl

# 그레인·험 바가 iTime 에 걸려 있어 루프가 필요하다. 포커스 창에서만 돌고 CPU 는 한 자릿수 퍼센트.
custom-shader-animation = true

# 곡률·스캔라인·그릴이 화면을 깎아서 다른 룩(0.94)보다 더 비치게 둔다. crt.glsl 은 곡률
# 안쪽만 알파를 흘려보내고 바깥은 불투명하게 남긴다 — 거기까지 비치면 창에 구멍이 뚫린다.
background-opacity = 0.9

# 배럴 왜곡이 가장자리를 안쪽으로 밀어서, 여백이 없으면 첫 글자와 끝 줄이 휜다.
window-padding-x = 34
window-padding-y = 28
