# AeroSpace tiling window manager config.
# Managed by Nix — symlinked read-only from the store via modules/darwin/files.nix.
# To change: edit this file and `darwin-rebuild switch`, then `alt-shift-;` -> `esc`
# (service mode reload) or it auto-reloads on the next launch.
# Reference: https://nikitabobko.github.io/AeroSpace/guide

# Commands to run after AeroSpace startup / login. Left empty.
after-login-command = []
after-startup-command = []

# We start AeroSpace via a Nix-managed LaunchAgent (hosts/darwin/default.nix),
# so don't also register AeroSpace's own login item.
start-at-login = false

# Normalizations — keep the tree tidy. Defaults, kept explicit.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Padding inside the accordion layout.
accordion-padding = 30

# New windows tile by default. 'horizontal' rather than 'auto' to sit closer to
# niri: there the workspace is a row of columns and a new window always lands as
# a new column to the right. 'auto' picks the orientation from the monitor's
# aspect ratio, which on a portrait display would stack windows vertically
# instead. Set it back to 'auto' if that is the behaviour you want per-monitor.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Follow focus with the mouse when switching monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Don't fight with macOS-hidden apps (Cmd-H).
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Gaps between windows and screen edges (points).
[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       0
outer.bottom =     0
outer.top =        0
outer.right =      0

# ----------------------------------------------------------------------------
# Main mode — active by default. Modifier is alt (⌥).
#
# The layout mirrors the niri session in modules/nixos/niri/rice/config.kdl as
# far as macOS allows: alt here plays the role of niri's Mod (Super), and
# alt-ctrl the role of niri's Mod+Ctrl "move, don't focus" family. Where niri
# has no AeroSpace counterpart (center-column, preset column widths, the hotkey
# overlay) the binding is simply absent rather than approximated with something
# that behaves differently.
# ----------------------------------------------------------------------------
[mode.main.binding]

# Terminal, as niri's Mod+Return.
# `open -na` starts a *second* Ghostty process rather than adding a window to
# the running one — Ghostty's own `+new-window` action is unimplemented on
# macOS ("not supported on this platform"), and every other route needs
# Accessibility keystroke injection. Drop the -n to merely focus an existing
# Ghostty instead of getting a new window.
alt-enter = 'exec-and-forget open -na Ghostty'

# Close the focused window (niri Mod+Q). Distinct from Cmd-Q, which quits the
# whole application.
alt-q = 'close'

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'      # toggle horizontal/vertical tiles
alt-comma = 'layout accordion horizontal vertical'  # toggle accordion

# Focus (vim hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move focused window. alt-shift is AeroSpace's own convention; alt-ctrl is the
# same thing under niri's fingers (Mod+Ctrl+hjkl). Both are live — pick one and
# the other costs nothing.
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# Resize. niri's Mod+-/= step the column width by 10%; AeroSpace works in
# points, and 'smart' resizes along whichever axis the parent container runs.
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Even out the current workspace. Not niri's Mod+R (which cycles the 33/50/66
# preset column widths — AeroSpace has no preset list), but it is the nearest
# "put the widths back to something sane" key.
alt-r = 'balance-sizes'

# Fullscreen (within the AeroSpace layout, not native macOS fullscreen) —
# closest to niri's Mod+F maximize-column. alt-shift-f is the real thing, as
# niri's Mod+Shift+F: a native macOS fullscreen Space.
alt-f = 'fullscreen'
alt-shift-f = 'macos-native-fullscreen'

# Floating <-> tiling toggle for the focused window
alt-shift-space = 'layout floating tiling'

# Switch to workspace 1..9
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move focused window to workspace 1..9
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Step through workspaces without naming one, as niri's Mod+U / Mod+I
# (focus-workspace-down / -up). u goes toward higher numbers, i toward lower —
# same direction the niri binds move, so the muscle memory carries over.
alt-u = 'workspace --wrap-around next'
alt-i = 'workspace --wrap-around prev'
alt-ctrl-u = 'move-node-to-workspace --wrap-around next'
alt-ctrl-i = 'move-node-to-workspace --wrap-around prev'

# Jump back to the previous workspace
alt-tab = 'workspace-back-and-forth'
# Send the current workspace to the next monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode (for reload / tree surgery)
alt-shift-semicolon = 'mode service'

# ----------------------------------------------------------------------------
# Service mode — one-shot helpers, returns to main mode after each.
# Enter with alt-shift-; ; press esc to leave.
# ----------------------------------------------------------------------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']            # reset the layout tree
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join the focused window with a neighbor (build splits)
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
