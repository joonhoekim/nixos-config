# frosted 프로필의 alacritty 조각. apps/rice-switch 가 ~/.config/alacritty/rice.toml
# 로 복사한다. 색은 여기 없다 — DMS/matugen 이 dank-theme.toml 에 따로 쓰고,
# alacritty.toml 이 둘 다 import 한다.
# 뒤가 비치는 터미널. niri 의 gaps 14 와 맞춰 패딩도 넓게.
# 0.82 아래로 내리면 배경 사진에 따라 본문이 읽히지 않는다.

[window]
opacity = 0.82

[window.padding]
x = 28
y = 28

[font]
size = 10
