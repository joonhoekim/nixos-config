# ~/.config/gtk-3.0/settings.ini 와 gtk-4.0/settings.ini 의 초기값.
#
# 왜 home-manager 의 `gtk` 모듈이 아니라 시드인가: DMS 가 같은 파일을 건드린다.
# SettingsData.qml 의 updateGtkIconTheme 은 아이콘 테마를 바꿀 때 여기에
# gtk-icon-theme-name 을 sed 로 써 넣고, scripts/gtk.sh 는 gtk.css 를 갈아친다.
# home-manager 가 심링크로 잡고 있으면 둘 중 하나가 지고, 진 쪽이 다음 rebuild 를
# "would be clobbered" 로 막아 세운다 — galaxy-chromebook-1 이 실제로 그렇게 됐다.
#
# 그래서 쓰기 가능한 평범한 파일로 깔아만 두고 소유권은 DMS 에 넘긴다. GTK3 앱은
# 니리 세션에서 XSettings 가 없어 이 파일을 직접 읽으므로, 비어 있으면 라이트
# 테마로 뜬다. 그 바닥값을 채우는 게 이 파일의 역할이다.
#
# 색 자체는 여기 없다 — DMS 가 dank-colors.css 에 쓰고, 설정 GUI 의
# "Apply GTK colors" 가 gtk.css 에서 그걸 import 하게 만든다.
#
# GNOME 용이 아니다. GNOME 세션에서는 gnome-settings-daemon 이 XSettings 로
# 방송하고 GTK 는 dconf(org/gnome/desktop/interface, ../../home-manager.nix)를
# 따라가므로 이 파일은 사실상 안 읽힌다. 즉 GNOME 을 걷어내면 이게 유일한 경로가
# 된다 — 같이 지울 것은 저 dconf 블록 쪽이다.
#
# 되받는 건 apps/rice-save 다. 레포에는 이 파일 하나뿐이라 gtk-3.0 을 정본으로
# 삼고, gtk-4.0 이 어긋나면 거기서 알려 준다.

[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=Adwaita
