# fuzzel — 폴백 런처(Mod+D)이자 apps/rice/wall --pick 의 dmenu 백엔드. 형태만 정한다.
# 색은 맨 위에 include 되는 dank-rice.ini 에 있다. 여기 [colors] 를 두면 생성된 색을 덮어쓴다.

[main]
font=Inter:size=11
dpi-aware=no

prompt="❯ "
icon-theme=Adwaita
icons-enabled=yes

# rice-fuzzel 이 화면 높이의 80%로 다시 계산하기 전의 폴백. 폭은 문자 수 — 좁으면 월페이퍼 경로가 잘린다.
lines=12
width=45

horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=24

# overlay 라 DMS 바보다 위에 뜬다.
layer=overlay
exit-on-keyboard-focus-loss=yes

[border]
width=2
# dank-rice.ini 가 덮어쓴다(프로필의 cornerRadius).
radius=12
