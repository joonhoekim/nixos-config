# gtk-3.0/gtk-4.0 settings.ini 의 초기값. HM `gtk` 모듈이 아닌 이유: DMS 가 같은 파일을 sed 로 고쳐서
# (SettingsData.qml 의 updateGtkIconTheme) 심링크면 다음 rebuild 가 "would be clobbered" 로 멈춘다.
# 니리에는 XSettings 가 없어 GTK 가 이 파일을 직접 읽는다(비면 라이트 테마). 전체 그림: docs/niri.md

[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
